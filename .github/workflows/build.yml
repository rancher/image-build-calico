on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  security-events: write # upload Sarif results

name: Build
jobs:
  build-calico-amd64:
    runs-on: ${{ github.repository_owner == 'rancher' && format('runs-on,runner=4cpu-linux-x64,run-id={0}', github.run_id) || 'ubuntu-latest' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Set the TAG value
      id: get-TAG
      run: |
        TAG="$(make -s log | sed -n 's/^TAG=//p')"
        echo "TAG=${TAG}" >> "$GITHUB_ENV"
        echo "BUILD_TAG=${TAG}-build$(date +%Y%m%d)" >> "$GITHUB_ENV"

    - name: Build Calico container images
      run: |
        for target in image-build-calico \
          image-build-calico-node \
          image-build-calico-whisker; do
          echo "Building ${target}"
          time env -u TAG GITHUB_ACTION_TAG="${BUILD_TAG}" make "${target}"
        done

    - name: Install Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

    - name: Scan Calico container images
      run: |
        for image in hardened-calico hardened-calico-node hardened-calico-whisker; do
          trivy image \
            --ignore-unfixed \
            --no-progress \
            --vuln-type os,library \
            --severity CRITICAL,HIGH \
            --format sarif \
            --output "trivy-results-${image}-amd64.sarif" \
            "rancher/${image}:${BUILD_TAG}"
        done

    - name: Upload Calico scan results to GitHub Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
      with:
        sarif_file: 'trivy-results-hardened-calico-amd64.sarif'
        category: hardened-calico-amd64

    - name: Upload Calico Node scan results to GitHub Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
      with:
        sarif_file: 'trivy-results-hardened-calico-node-amd64.sarif'
        category: hardened-calico-node-amd64

  build-envoy-amd64:
    runs-on: ${{ github.repository_owner == 'rancher' && format('runs-on,runner=4cpu-linux-x64,run-id={0}', github.run_id) || 'ubuntu-latest' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Set the TAG value
      run: |
        TAG="$(make -s log | sed -n 's/^TAG=//p')"
        echo "TAG=${TAG}" >> "$GITHUB_ENV"
        echo "BUILD_TAG=${TAG}-build$(date +%Y%m%d)" >> "$GITHUB_ENV"

    - name: Build Envoy container images
      run: |
        for target in \
          image-build-calico-envoy-gateway \
          image-build-calico-envoy-ratelimit \
          image-build-calico-envoy-proxy; do
          echo "Building ${target}"
          time env -u TAG GITHUB_ACTION_TAG="${BUILD_TAG}" make "${target}"
        done

    - name: Install Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

    - name: Scan Envoy container images
      run: |
        for image in \
          hardened-calico-envoy-gateway \
          hardened-calico-envoy-ratelimit \
          hardened-calico-envoy-proxy; do
          trivy image \
            --ignore-unfixed \
            --no-progress \
            --vuln-type os,library \
            --severity CRITICAL,HIGH \
            --format sarif \
            --output "trivy-results-${image}-amd64.sarif" \
            "rancher/${image}:${BUILD_TAG}"
        done

    - name: Upload Envoy Gateway scan results to GitHub Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
      with:
        sarif_file: 'trivy-results-hardened-calico-envoy-gateway-amd64.sarif'
        category: hardened-calico-envoy-gateway-amd64

    - name: Upload Envoy Ratelimit scan results to GitHub Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
      with:
        sarif_file: 'trivy-results-hardened-calico-envoy-ratelimit-amd64.sarif'
        category: hardened-calico-envoy-ratelimit-amd64

    - name: Upload Envoy Proxy scan results to GitHub Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
      with:
        sarif_file: 'trivy-results-hardened-calico-envoy-proxy-amd64.sarif'
        category: hardened-calico-envoy-proxy-amd64

  build-calico-arm64:
    runs-on: ${{ github.repository_owner == 'rancher' && format('runs-on,runner=4cpu-linux-arm64,run-id={0}', github.run_id) || 'ubuntu-24.04-arm' }}
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Set the TAG value
      id: get-TAG
      run: |
        TAG="$(make -s log | sed -n 's/^TAG=//p')"
        echo "TAG=${TAG}" >> "$GITHUB_ENV"
        echo "BUILD_TAG=${TAG}-build$(date +%Y%m%d)" >> "$GITHUB_ENV"

    - name: Build Calico container images
      run: |
        for target in image-build-calico \
          image-build-calico-node \
          image-build-calico-whisker; do
          echo "Building ${target}"
          time env -u TAG GITHUB_ACTION_TAG="${BUILD_TAG}" make "${target}"
        done

  build-envoy-arm64:
    runs-on: ${{ github.repository_owner == 'rancher' && format('runs-on,runner=4cpu-linux-arm64,run-id={0}', github.run_id) || 'ubuntu-24.04-arm' }}
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Set the TAG value
      run: |
        TAG="$(make -s log | sed -n 's/^TAG=//p')"
        echo "TAG=${TAG}" >> "$GITHUB_ENV"
        echo "BUILD_TAG=${TAG}-build$(date +%Y%m%d)" >> "$GITHUB_ENV"

    - name: Build Envoy container images
      run: |
        for target in \
          image-build-calico-envoy-gateway \
          image-build-calico-envoy-ratelimit \
          image-build-calico-envoy-proxy; do
          echo "Building ${target}"
          time env -u TAG GITHUB_ACTION_TAG="${BUILD_TAG}" make "${target}"
        done
