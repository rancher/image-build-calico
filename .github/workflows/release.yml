on:
  release:
    types: [published]

env:
  GITHUB_ACTION_TAG: ${{ github.event.release.tag_name }}  

jobs:
  build-amd64-digest:
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [calico, calico-node, calico-envoy-gateway, calico-envoy-proxy, calico-envoy-ratelimit]
    runs-on: ${{ github.repository_owner == 'rancher' && format('runs-on,runner=4cpu-linux-x64,run-id={0}', github.run_id) || 'ubuntu-latest' }}
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set build values
      run: |
        echo "$(make -s log | grep BUILDDIR)" >> "$GITHUB_ENV"
        echo "$(make -s log | grep ARCH)" >> "$GITHUB_ENV"

    - name: Docker meta
      id: meta-amd64
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ github.repository_owner }}/hardened-${{ matrix.image }}

    - name: "Read secrets"
      if: github.repository_owner == 'rancher'
      uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
      with:
        secrets: |
          secret/data/github/repo/${{ github.repository }}/dockerhub/${{ github.repository_owner }}/credentials username | DOCKER_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/dockerhub/${{ github.repository_owner }}/credentials password | DOCKER_PASSWORD ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials registry | PRIME_REGISTRY ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials username | PRIME_REGISTRY_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials password | PRIME_REGISTRY_PASSWORD ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials registry | STAGING_REGISTRY ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials username | STAGING_REGISTRY_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials password | STAGING_REGISTRY_PASSWORD ;

    - name: Build and push container image - Staging
      if: github.repository_owner == 'rancher'
      uses: rancher/ecm-distro-tools/actions/publish-image@086cd2f90ed82712e45701441a00e59b95b578c1 # v0.77.1
      env:
        META_LABELS: ${{ steps.meta-amd64.outputs.labels }}
      with:
        image: hardened-${{ matrix.image }}
        make-target: push-image-${{ matrix.image }}
        tag: ${{ github.event.release.tag_name }}
        platforms: linux/amd64
        push-to-public: false
        prime-repo: rancher
        prime-registry: ${{ env.STAGING_REGISTRY }}
        prime-username: ${{ env.STAGING_REGISTRY_USERNAME }}
        prime-password: ${{ env.STAGING_REGISTRY_PASSWORD }}

    - name: Build and push container image
      uses: rancher/ecm-distro-tools/actions/publish-image@086cd2f90ed82712e45701441a00e59b95b578c1 # v0.77.1
      env:
        META_LABELS: ${{ steps.meta-amd64.outputs.labels }}
      with:
        image: hardened-${{ matrix.image }}
        make-target: push-image-${{ matrix.image }}
        skip-buildx-setup: ${{ github.repository_owner == 'rancher' }}
        tag: ${{ github.event.release.tag_name }}
        platforms: linux/amd64
        public-repo: ${{ github.repository_owner }}
        public-username: ${{ github.repository_owner == 'rancher' && env.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}
        public-password: ${{ github.repository_owner == 'rancher' && env.DOCKER_PASSWORD || secrets.DOCKER_PASSWORD }}
        push-to-public: ${{ github.repository_owner != 'rancher' || matrix.image == 'calico' }}
        prime-repo: rancher
        prime-registry: ${{ env.PRIME_REGISTRY }}
        prime-username: ${{ env.PRIME_REGISTRY_USERNAME }}
        prime-password: ${{ env.PRIME_REGISTRY_PASSWORD }}
        push-to-prime: ${{ github.repository_owner == 'rancher' }}

    - name: Upload metadata files
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: metadata-hardened-${{ matrix.image }}-amd64
        path: ${{ env.BUILDDIR }}
        if-no-files-found: error
        retention-days: 1

  build-arm64-digest:
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [calico, calico-node, calico-envoy-gateway, calico-envoy-proxy, calico-envoy-ratelimit]
    runs-on: ${{ github.repository_owner == 'rancher' && format('runs-on,runner=4cpu-linux-arm64,run-id={0}', github.run_id) || 'ubuntu-24.04-arm' }}
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set build values
      run: |
        echo "$(make -s log | grep BUILDDIR)" >> "$GITHUB_ENV"
        echo "$(make -s log | grep ARCH)" >> "$GITHUB_ENV"

    - name: Docker meta
      id: meta-arm64
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ github.repository_owner }}/hardened-${{ matrix.image }}

    - name: "Read secrets"
      if: github.repository_owner == 'rancher'
      uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
      with:
        secrets: |
          secret/data/github/repo/${{ github.repository }}/dockerhub/${{ github.repository_owner }}/credentials username | DOCKER_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/dockerhub/${{ github.repository_owner }}/credentials password | DOCKER_PASSWORD ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials registry | PRIME_REGISTRY ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials username | PRIME_REGISTRY_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials password | PRIME_REGISTRY_PASSWORD ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials registry | STAGING_REGISTRY ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials username | STAGING_REGISTRY_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials password | STAGING_REGISTRY_PASSWORD ;

    - name: Build and push container image - Staging
      if: github.repository_owner == 'rancher'
      uses: rancher/ecm-distro-tools/actions/publish-image@086cd2f90ed82712e45701441a00e59b95b578c1 # v0.77.1
      env:
        META_LABELS: ${{ steps.meta-arm64.outputs.labels }}
      with:
        image: hardened-${{ matrix.image }}
        make-target: push-image-${{ matrix.image }}
        tag: ${{ github.event.release.tag_name }}
        platforms: linux/arm64
        push-to-public: false
        prime-repo: rancher
        prime-registry: ${{ env.STAGING_REGISTRY }}
        prime-username: ${{ env.STAGING_REGISTRY_USERNAME }}
        prime-password: ${{ env.STAGING_REGISTRY_PASSWORD }}

    - name: Build and push container image
      uses: rancher/ecm-distro-tools/actions/publish-image@086cd2f90ed82712e45701441a00e59b95b578c1 # v0.77.1
      env:
        META_LABELS: ${{ steps.meta-arm64.outputs.labels }}
      with:
        image: hardened-${{ matrix.image }}
        make-target: push-image-${{ matrix.image }}
        skip-buildx-setup: ${{ github.repository_owner == 'rancher' }}
        tag: ${{ github.event.release.tag_name }}
        platforms: linux/arm64
        public-repo: ${{ github.repository_owner }}
        public-username: ${{ github.repository_owner == 'rancher' && env.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}
        public-password: ${{ github.repository_owner == 'rancher' && env.DOCKER_PASSWORD || secrets.DOCKER_PASSWORD }}
        push-to-public: ${{ github.repository_owner != 'rancher' || matrix.image == 'calico' }}
        prime-repo: rancher
        prime-registry: ${{ env.PRIME_REGISTRY }}
        prime-username: ${{ env.PRIME_REGISTRY_USERNAME }}
        prime-password: ${{ env.PRIME_REGISTRY_PASSWORD }}
        push-to-prime: ${{ github.repository_owner == 'rancher' }}

    - name: Upload metadata files
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: metadata-hardened-${{ matrix.image }}-arm64
        path: ${{ env.BUILDDIR }}
        if-no-files-found: error
        retention-days: 1

  merge:
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [calico, calico-node, calico-envoy-gateway, calico-envoy-proxy, calico-envoy-ratelimit]
    runs-on: ubuntu-latest
    needs: 
      - build-amd64-digest
      - build-arm64-digest
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set build values
      run: echo "$(make -s log | grep BUILDDIR)" >> "$GITHUB_ENV"

    - name: Download digest metadata
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: metadata-hardened-${{ matrix.image }}-*
        path: ${{ env.BUILDDIR }}
        merge-multiple: true

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ github.repository_owner }}/hardened-${{ matrix.image }}

    - name: "Read secrets"
      if: github.repository_owner == 'rancher'
      uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
      with:
        secrets: |
          secret/data/github/repo/${{ github.repository }}/dockerhub/${{ github.repository_owner }}/credentials username | DOCKER_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/dockerhub/${{ github.repository_owner }}/credentials password | DOCKER_PASSWORD ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials registry | PRIME_REGISTRY ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials username | PRIME_REGISTRY_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials password | PRIME_REGISTRY_PASSWORD ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials registry | STAGING_REGISTRY ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials username | STAGING_REGISTRY_USERNAME ;
          secret/data/github/repo/${{ github.repository }}/rancher-prime-stg-registry/credentials password | STAGING_REGISTRY_PASSWORD ;

    - name: Create manifest list and push - Staging
      if: github.repository_owner == 'rancher'
      uses: rancher/ecm-distro-tools/actions/publish-image@086cd2f90ed82712e45701441a00e59b95b578c1 # v0.77.1
      env:
        MULTI_ARCH: "amd64 arm64"
        DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
      with:
        image: hardened-${{ matrix.image }}
        make-target: manifest-push-${{ matrix.image }}
        tag: ${{ github.event.release.tag_name }}
        push-to-public: false
        prime-repo: rancher
        prime-registry: ${{ env.STAGING_REGISTRY }}
        prime-username: ${{ env.STAGING_REGISTRY_USERNAME }}
        prime-password: ${{ env.STAGING_REGISTRY_PASSWORD }}

    - name: Create manifest list and push
      uses: rancher/ecm-distro-tools/actions/publish-image@086cd2f90ed82712e45701441a00e59b95b578c1 # v0.77.1
      env:
        MULTI_ARCH: "amd64 arm64"
        DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
      with:
        image: hardened-${{ matrix.image }}
        make-target: manifest-push-${{ matrix.image }}
        tag: ${{ github.event.release.tag_name }}
        public-repo: ${{ github.repository_owner }}
        public-username: ${{ github.repository_owner == 'rancher' && env.DOCKER_USERNAME || secrets.DOCKER_USERNAME }}
        public-password: ${{ github.repository_owner == 'rancher' && env.DOCKER_PASSWORD || secrets.DOCKER_PASSWORD }}
        push-to-public: ${{ github.repository_owner != 'rancher' || matrix.image == 'calico' }}
        prime-repo: rancher
        prime-registry: ${{ env.PRIME_REGISTRY }}
        prime-username: ${{ env.PRIME_REGISTRY_USERNAME }}
        prime-password: ${{ env.PRIME_REGISTRY_PASSWORD }}
        push-to-prime: ${{ github.repository_owner == 'rancher' }}